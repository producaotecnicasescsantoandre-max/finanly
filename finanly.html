async function signInWithGoogle() {
  const { data, error } = await supabase.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin,
    },
  });
  if (error) {
    console.error("Erro no login:", error);
    alert("Não foi possível conectar com o Google: " + error.message);
  }
}

async function signOut() {
  await supabase.auth.signOut();
  window.location.reload();
}

async function getCurrentUser() {
  const { data: { user } } = await supabase.auth.getUser();
  return user;
}

function parseMoneyToCents(text) {
  if (!text) return 0;
  const t = String(text).toLowerCase();
  const kMatch = t.match(/(\d+[.,]?\d*)\s*k/);
  if (kMatch) return Math.round(parseFloat(kMatch[1].replace(",", ".")) * 1000 * 100);
  const clean = t.replace(/[^\d.,]/g, "").replace(/\./g, "").replace(",", ".");
  const v = parseFloat(clean);
  if (!isNaN(v) && v > 0) return Math.round(v * 100);
  const m = t.match(/(\d+[.,]?\d*)/);
  if (m) {
    const n = parseFloat(m[1].replace(",", "."));
    if (!isNaN(n) && n > 10) return Math.round(n * 100);
  }
  return 0;
}

  },
  monthlyMargin(state) {
    return this.monthlyIncome(state) - this.monthlyFixed(state) - this.monthlyInstallments(state);
  },
  emergencyMonths(state) {
    const fixed = this.monthlyFixed(state);
    if (fixed <= 0) return 0;
    return (state.reservaCents || 0) / fixed;
  },
  emergencyTargetMonths(state) {
    // renda variável → 9; estável → 6
    const v = String(state.variacaoRenda || "").toLowerCase();
    if (/muito|50|40|30|varia/.test(v)) return 9;
    return 6;
  },
  scenarios(state) {
    const margin = this.monthlyMargin(state);
    const debt = this.totalDebt(state);
    const fixed = this.monthlyFixed(state);
    const emergency = state.reservaCents || 0;
    const build = (sav, dbt, goal) => {
      const toSav = Math.round(margin * sav);
      const toDebt = Math.round(margin * dbt);
      const toGoal = Math.round(margin * goal);
      const payoffMonths = toDebt > 0 && debt > 0 ? Math.ceil(debt / toDebt) : null;
      const target = fixed * 6;
      const reachMonths = toSav > 0 && fixed > 0
        ? Math.ceil(Math.max(0, target - emergency) / toSav)
        : null;
      return {
        toSavingsCents: toSav,
        toDebtCents: toDebt,
        toGoalsCents: toGoal,
        debtPayoffMonths: payoffMonths,
        emergencyReachMonths: reachMonths,
      };
    };
    return {
      conservador: build(0.6, 0.2, 0.2),
      equilibrado: build(0.4, 0.3, 0.3),
      acelerado: build(0.3, 0.5, 0.2),
    };
  },
};

const OPENAI_ENDPOINT = "https://api.openai.com/v1/chat/completions";
const OPENAI_MODEL = "gpt-4o-mini";

async function callOpenAI(apiKey, messages, tools) {
  const body = {
    model: OPENAI_MODEL,
    messages,
    tools,
    tool_choice: "auto",
    temperature: 0.3,
  };

  const res = await fetch(OPENAI_ENDPOINT, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${apiKey}`,
    },
    body: JSON.stringify(body),
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Erro ${res.status} na OpenAI`);
  }

  const data = await res.json();
  return data.choices[0].message;
}

function executeTool(toolName, args, state) {
  switch (toolName) {
    case "registrar_renda": {
      const cents = Math.round(args.valor * 100);
      const patch = { rendaMediaCents: cents };
      if (args.fonte) patch.fonteRenda = args.fonte;
      return { result: { ok: true, renda: brl(cents) }, patch };
    }
    case "registrar_gasto": {
      const cents = Math.round(args.valor * 100);
      const novo = {
        id: String(Date.now()),
        tipo: "despesa",
        descricao: args.descricao,
        valueCents: cents,
        date: new Date().toISOString(),
        isFixed: !!args.fixo,
      };
      const patch = { lancamentos: [...(state.lancamentos || []), novo] };
      if (args.fixo) {
        patch.gastosFixosCents = (state.gastosFixosCents || 0) + cents;
        patch.gastosFixosList = [...(state.gastosFixosList || []), { id: novo.id, name: args.descricao, valueCents: cents }];
      }
      return { result: { ok: true, descricao: args.descricao, valor: brl(cents) }, patch };
    }
    case "registrar_reserva": {
      const cents = Math.round(args.valor * 100);
      return { result: { ok: true, reserva: brl(cents) }, patch: { reservaCents: cents } };
    }
    case "registrar_divida": {
      const totalCents = Math.round(args.total * 100);
      const parcelaCents = args.parcela ? Math.round(args.parcela * 100) : Math.round(totalCents / 6);
      const nova = { id: String(Date.now()), name: args.descricao, totalCents, parcelaCents };
      return {
        result: { ok: true, divida: args.descricao, total: brl(totalCents), parcela: brl(parcelaCents) },
        patch: { dividas: [...(state.dividas || []), nova] },
      };
    }
    case "registrar_meta": {
      const valueCents = Math.round(args.valor * 100);
      const nova = {
        id: String(Date.now()),
        title: args.titulo,
        valueCents,
        months: args.meses,
        priority: args.prioridade || "média",
        progress: 0,
      };
      return {
        result: { ok: true, meta: args.titulo, valor: brl(valueCents), meses: args.meses },
        patch: { metas: [...(state.metas || []), nova] },
      };
    }
    case "consultar_situacao": {
      const margin = Finance.monthlyMargin(state);
      const emergMonths = Finance.emergencyMonths(state);
      const scenarios = Finance.scenarios(state);
      return {
        result: {
          renda_mensal: brl(state.rendaMediaCents),
          gastos_fixos: brl(Finance.monthlyFixed(state)),
          parcelas: brl(Finance.monthlyInstallments(state)),
          divida_total: brl(Finance.totalDebt(state)),
          margem_mensal: brl(margin),
          reserva: brl(state.reservaCents),
          reserva_em_meses: emergMonths.toFixed(1),
          meta_reserva_meses: Finance.emergencyTargetMonths(state),
          cenarios: {
            conservador: scenarios.conservador,
            equilibrado: scenarios.equilibrado,
            acelerado: scenarios.acelerado,
          },
          metas: (state.metas || []).map(m => ({ titulo: m.title, valor: brl(m.valueCents), meses: m.months })),
        },
        patch: null,
      };
    }
    default:
      return { result: { ok: false, error: "Ferramenta desconhecida" }, patch: null };
  }
}

function buildSystemPrompt(state) {
  return `Você é o Claro, um consultor financeiro pessoal, empático, direto e sem julgamento. Fala português do Brasil.

REGRAS CRÍTICAS:
1. Você NUNCA calcula nada. Sempre que precisar de um número, chame a ferramenta consultar_situacao.
2. Você NUNCA inventa saldos, rendas, dívidas ou reservas. Se não souber, pergunte.
3. Quando o usuário informar um dado (renda, gasto, reserva, dívida, meta), chame a ferramenta correspondente para registrar.
4. Quando corrigir um dado, registre de novo com o valor correto.
5. Explique o que você fez de forma simples, humana, sem jargão financeiro.
6. Se o usuário estiver com margem negativa ou reserva baixa, seja honesto mas acolhedor — sem culpa.
7. Seja conciso. 2-4 parágrafos no máximo, a não ser que o usuário peça detalhe.

DADOS ATUAIS DO USUÁRIO (contexto, não use como cálculo):
${JSON.stringify({ nome: state.nome, cidade: state.cidade, fonteRenda: state.fonteRenda, temDados: state.completed }, null, 2)}

Sempre responda em português. Se o usuário perguntar algo que não é financeiro, redirecione gentilmente.`;
}

async function runAIChat(apiKey, userMessage, history, state, onToolExecuted) {
  const tools = buildTools();
  const messages = [
    { role: "system", content: buildSystemPrompt(state) },
    ...history.slice(-10).map(m => ({ role: m.role === "ai" ? "assistant" : "user", content: m.text })),
    { role: "user", content: userMessage },
  ];

  let assistantMsg = await callOpenAI(apiKey, messages, tools);

  const toolCalls = assistantMsg.tool_calls || [];
  if (toolCalls.length > 0) {
    messages.push(assistantMsg);

    for (const call of toolCalls) {
      const { name, arguments: argsStr } = call.function;
      let args = {};
      try { args = JSON.parse(argsStr); } catch {}

      const { result, patch } = executeTool(name, args, state);
      if (patch && onToolExecuted) onToolExecuted(patch, name, args);

      messages.push({
        role: "tool",
        tool_call_id: call.id,
        content: JSON.stringify(result),
      });
    }

    assistantMsg = await callOpenAI(apiKey, messages, tools);
  }

  return assistantMsg.content || "Pronto.";
}

function detectIntent(text) {
  const t = text.toLowerCase().trim();
  if (/^(oi|ola|olá|bom dia|boa tarde|boa noite|hey|hello)/.test(t)) return "saudacao";
  if (/minha renda (é|e|eh)|na verdade.*renda|renda.*(é|e|eh)\s*\d/.test(t)) return "set_renda";
  if (/minha reserva (é|e|eh)|tenho.*guardado|reserva.*(é|e|eh)\s*\d/.test(t)) return "set_reserva";
  if (/gasto|gastei|paguei|despesa/.test(t) && /\d/.test(t)) return "add_despesa";
  if (/recebi|entrou|receita/.test(t) && /\d/.test(t)) return "add_receita";
  if (/reserva|emergência|emergencia/.test(t)) return "q_reserva";
  if (/dívida|divida|devendo|parcela|cartão|cartao/.test(t)) return "q_divida";
  if (/viajar|viagem|meta|objetivo|sonho/.test(t)) return "q_meta";
  if (/posso gastar|quanto sobra|margem|livre/.test(t)) return "q_margem";
  if (/investir|investimento|render/.test(t)) return "q_investir";
  if (/ajuda|o que.*fazer|por onde|começ|comec/.test(t)) return "q_ajuda";
  return "geral";
}

function buildChatResponse(intent, text, state) {
  const margin = Finance.monthlyMargin(state);
  const emergMonths = Finance.emergencyMonths(state);
  const fixed = Finance.monthlyFixed(state);
  const installments = Finance.monthlyInstallments(state);
  const totalDebt = Finance.totalDebt(state);

  switch (intent) {
    case "saudacao":
      return { reply: `Oi${state.nome ? `, ${state.nome}` : ""}. Estou aqui com seus números atualizados. Pode me perguntar qualquer coisa ou dizer "na verdade minha renda é 9k" que eu ajusto tudo na hora. Eu nunca invento saldos — só uso o que você confirmou.`, patch: null };
    case "set_renda": {
      const val = parseMoneyToCents(text);
      if (!val) return { reply: "Não consegui entender o valor. Pode dizer algo como 'minha renda é 9.000'?", patch: null };
      const novaMargem = val - fixed - installments;
      return {
        reply: `Atualizei sua renda para ${brl(val)}. Recalculando...\n\nSua nova margem estimada é ${brl(novaMargem)} por mês. Se quiser, olhe os cenários na aba "Meu Plano" para ver o impacto nas metas.`,
        patch: { rendaMediaCents: val },
        highlight: ["rendaMediaCents", "margem"],
      };
    }
    case "set_reserva": {
      const val = parseMoneyToCents(text);
      if (!val) return { reply: "Não consegui entender o valor. Tente algo como 'tenho 10 mil guardados'.", patch: null };
      const months = fixed > 0 ? val / fixed : 0;
      return {
        reply: `Anotei: reserva de ${brl(val)}.\n\nIsso cobre ${months.toFixed(1)} meses dos seus custos fixos de ${brl(fixed)}. Sua meta é ${Finance.emergencyTargetMonths(state)} meses — então ${months >= Finance.emergencyTargetMonths(state) ? "você está dentro do ideal." : "ainda falta um pouco de colchão."}`,
        patch: { reservaCents: val },
        highlight: ["reservaCents", "reserva"],
      };
    }
    case "q_reserva":
      return {
        reply: `Hoje sua reserva de ${brl(state.reservaCents)} cobre ${emergMonths.toFixed(1)} meses dos seus custos fixos de ${brl(fixed)}.\n\nPara renda variável como a sua, o ideal é entre 6 e 9 meses. Estamos em ${emergMonths.toFixed(1)}, então nosso foco continua sendo aumentar esse colchão — cerca de ${brl(Math.max(0, fixed * 6 - state.reservaCents))} para chegar em 6 meses.`,
        patch: null,
      };
    case "q_divida":
      return {
        reply: totalDebt === 0
          ? "Você não tem dívidas registradas. Ótimo sinal — podemos focar 100% em reserva e metas."
          : `Suas dívidas somam ${brl(totalDebt)} com parcelas de ${brl(installments)} por mês.\n\nMinha recomendação: antes de investir mais, priorizar o que tem juros maiores. Se quiser, me diz a taxa do cartão que eu simulo quanto você economiza antecipando.`,
        patch: null,
      };
    case "q_meta": {
      const meta = state.metas[0];
      if (!meta) return { reply: "Ainda não registramos nenhuma meta. Me conta o que mais importa pra você nos próximos 12 meses?", patch: null };
      const faltando = Math.max(0, (meta.valueCents || 0) - ((meta.valueCents || 0) * (meta.progress || 0) / 100));
      const perMonth = meta.months > 0 ? Math.ceil(faltando / meta.months) : 0;
      return {
        reply: `Para sua meta "${meta.title}" de ${brl(meta.valueCents)} em ${meta.months} meses, você precisaria separar aproximadamente ${brl(perMonth)} por mês.\n\nCom sua margem atual de ${brl(margin)}, isso é ${perMonth <= margin ? "viável no cenário equilibrado." : "apertado — vale revisar prazo ou valor."}`,
        patch: null,
      };
    }
    case "q_margem":
      return {
        reply: `Sua margem estimada este mês é ${brl(margin)}.\n\nCheguei nisso assim: renda ${brl(state.rendaMediaCents)} − fixos ${brl(fixed)} − parcelas ${brl(installments)}.\n\nDesse valor, minha sugestão é separar ~40% (${brl(Math.round(margin * 0.4))}) para reserva e o resto dividir entre metas e dívidas. Quer ver os cenários?`,
        patch: null,
      };
    case "q_investir":
      return {
        reply: emergMonths < 6
          ? `Antes de investir mais, eu focaria em reserva. Hoje ela cobre ${emergMonths.toFixed(1)} meses — o ideal pra você é 6. Depois disso, a gente pensa em produtos com liquidez e risco compatíveis com seu perfil.`
          : `Sua reserva já está saudável (${emergMonths.toFixed(1)} meses). Agora faz sentido pensar em investimentos de médio prazo para suas metas. Quer que eu detalhe os tipos de produto?`,
        patch: null,
      };
    case "q_ajuda":
      return {
        reply: `Meus próximos passos sugeridos, na ordem:\n\n1. Manter a reserva crescendo até 6 meses de custo.\n2. Priorizar quitar o cartão (juros mais altos).\n3. Só depois acelerar metas de médio prazo.\n\nVocê quer que eu detalhe algum desses?`,
        patch: null,
      };
    case "add_despesa": {
      const val = parseMoneyToCents(text);
      if (!val) return { reply: "Entendi que você gastou, mas não peguei o valor. Pode dizer quanto?", patch: null };
      const desc = text.replace(/[\d.,R$\s]+/gi, "").trim().slice(0, 40) || "Gasto";
      const novo = { id: String(Date.now()), tipo: "despesa", descricao: desc, valueCents: val, date: new Date().toISOString(), isFixed: false };
      return {
        reply: `Anotei: ${brl(val)} em "${desc}".\n\nIsso reduz sua margem para ${brl(margin - val)}. Quer que eu classifique como gasto fixo ou pontual?`,
        patch: { lancamentos: [...(state.lancamentos || []), novo] },
      };
    }
    case "add_receita": {
      const val = parseMoneyToCents(text);
      if (!val) return { reply: "Entendi que entrou dinheiro, mas não peguei o valor. Pode dizer quanto?", patch: null };
      const desc = text.replace(/[\d.,R$\s]+/gi, "").trim().slice(0, 40) || "Receita";
      const novo = { id: String(Date.now()), tipo: "receita", descricao: desc, valueCents: val, date: new Date().toISOString(), isFixed: false };
      return {
        reply: `Anotei: ${brl(val)} de "${desc}".\n\nIsso aumenta sua margem para ${brl(margin + val)} este mês. Quer que eu ajuste alguma meta?`,
        patch: { lancamentos: [...(state.lancamentos || []), novo] },
      };
    }
    default:
      return {
        reply: `Entendi. Com base nos seus dados confirmados — renda ${brl(state.rendaMediaCents)}, fixos ${brl(fixed)}, parcelas ${brl(installments)} e reserva de ${brl(state.reservaCents)} — minha leitura é:\n\nSua margem de ${brl(margin)} está ${margin > 0 ? "saudável" : "negativa, precisamos reequilibrar"}. Sua reserva cobre ${emergMonths.toFixed(1)} meses, ${emergMonths < 6 ? "abaixo do ideal" : "dentro do ideal"}.\n\nQuer que eu detalhe algum ponto? Posso falar sobre reserva, dívidas, metas, ou simular um gasto novo.`,
        patch: null,
      };
  }
}

                <path fill="#fff" d="M5.84 14.09A6.6 6.6 0 0 1 5.5 12c0-.72.12-1.43.34-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/>
                <path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>

function Onboarding({ onComplete, onSkip }) {
  const script = useMemo(buildScript, []);
  const [step, setStep] = useState(0);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [state, setState] = useState(EMPTY_STATE);
  const [confirmation, setConfirmation] = useState(null);
  const endRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    setTyping(true);
    const t = setTimeout(() => {
      setMessages([{ role: "ai", text: script[0].question(EMPTY_STATE) }]);
      setTyping(false);
    }, 500);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    endRef.current?.scrollIntoView({ behavior: "smooth" });
    inputRef.current?.focus();
  }, [messages, typing, confirmation]);

  const submit = (value) => {
    const text = (value ?? input).trim();
    if (!text) return;
    setMessages((m) => [...m, { role: "user", text }]);
    setInput("");

    const current = script[step];
    const patch = current.parser ? current.parser(text, state) : {};
    const nextState = { ...state, ...patch };
    setState(nextState);

    // Confirmação adaptativa: renda + fixos já definidos
    if (nextState.rendaMediaCents > 0 && nextState.gastosFixosCents > 0 && step >= 6 && !confirmation) {
      setConfirmation({
        text: `Entendi que sua renda média é de ${brl(nextState.rendaMediaCents)} e seus compromissos fixos somam cerca de ${brl(nextState.gastosFixosCents)}. Está correto?`,
      });
    }

    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      if (step < script.length - 1) {
        const nextStep = step + 1;
        setStep(nextStep);
        setMessages((m) => [...m, { role: "ai", text: script[nextStep].question(nextState) }]);
      } else {
        setMessages((m) => [...m, {
          role: "ai",
          text: `Perfeito, ${nextState.nome || "tudo certo"}. Já tenho o que preciso para desenhar seu primeiro plano.\n\nVou organizar tudo e te mostrar quanto sobra, quanto sua reserva cobre e por onde começar.`,
        }]);
      }
    }, 850);
  };

  const finish = () => {
    onComplete({ ...state, completed: true });
  };

  const progress = ((step + 1) / script.length) * 100;
  const isLast = step === script.length - 1;
  const readyToFinish = isLast && !typing && messages.length >= script.length * 2 - 1;

  return (
    <div className="min-h-screen bg-[#FAF9F7] flex flex-col">
      <div className="w-full h-[2px] bg-[#E8DDD0]/60 sticky top-0 z-20">
        <div className="h-full bg-[#111] transition-all duration-700 ease-out" style={{ width: `${progress}%` }} />
      </div>

      <header className="w-full max-w-[760px] mx-auto px-6 md:px-8 pt-8 pb-4 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <Avatar />
          <span className="text-[15px] font-medium tracking-tight text-[#111]">Claro</span>
          <span className="flex items-center gap-1.5 ml-3 pl-3 border-l border-[#E8DDD0] text-[12px] text-[#8A7F76]">
            <span className="w-2 h-2 rounded-full bg-[#7A9E7E] animate-pulse" /> online
          </span>
        </div>
        <button onClick={onSkip}
          className="text-[12px] font-medium text-[#8A7F76] hover:text-[#111] flex items-center gap-1.5 border border-[#E8DDD0] rounded-full px-3 py-1.5 bg-white/60 transition">
          <I.Eye size={14} /> Ver demonstração
        </button>
      </header>

      <main className="flex-1 w-full max-w-[760px] mx-auto px-6 md:px-8 pb-32">
        <div className="pt-6 pb-4">
          <p className="text-[11px] tracking-[0.14em] uppercase text-[#9C8F85] font-medium">
            Diagnóstico • {step + 1} de {script.length}
          </p>
        </div>

        <div className="space-y-6">
          {messages.map((m, i) => (
            <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"} animate-fade-in`}>
              {m.role === "ai" ? (
                <div className="flex gap-3 max-w-[88%]">
                  <Avatar />
                  <div className="bg-[#F2EDE8] rounded-[20px] rounded-tl-[6px] px-5 py-4 text-[15px] leading-[1.6] text-[#2B211C] whitespace-pre-wrap">
                    {m.text}
                  </div>
                </div>
              ) : (
                <div className="bg-[#111] text-white rounded-[20px] rounded-tr-[6px] px-5 py-3.5 text-[15px] leading-[1.5] max-w-[78%]">
                  {m.text}
                </div>
              )}
            </div>
          ))}

          {confirmation && (
            <div className="flex justify-start animate-fade-in">
              <div className="flex gap-3 max-w-[88%]">
                <Avatar color="#7A9E7E">
                  <I.Check size={14} />
                </Avatar>
                <div className="bg-white border border-[#E8DDD0] rounded-[20px] rounded-tl-[6px] px-5 py-4 shadow-sm">
                  <p className="text-[14px] leading-[1.5] text-[#2B211C]">{confirmation.text}</p>
                  <div className="flex gap-2 mt-3">
                    <button onClick={() => setConfirmation(null)}
                      className="text-[13px] font-medium bg-[#111] text-white px-4 py-2 rounded-full hover:bg-black transition">
                      Sim, está correto
                    </button>
                    <button onClick={() => { setConfirmation(null); setStep(5); setMessages((m) => [...m, { role: "ai", text: "Sem problema. Me diz de novo: em média, quanto entra por mês?" }]); }}
                      className="text-[13px] font-medium bg-[#FAF9F7] border border-[#E8DDD0] px-4 py-2 rounded-full hover:bg-white transition">
                      Quero corrigir
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {typing && (
            <div className="flex gap-3">
              <Avatar />
              <div className="bg-[#F2EDE8] rounded-[20px] rounded-tl-[6px] px-5 py-4"><TypingDots /></div>
            </div>
          )}

          {script[step]?.chips && !typing && (
            <div className="flex flex-wrap gap-2 pt-2 pl-11">
              {script[step].chips.map((c) => (
                <button key={c} onClick={() => submit(c)}
                  className="text-[13px] px-3.5 py-2 rounded-full bg-white border border-[#E8DDD0] text-[#2B211C] hover:border-[#111] hover:text-[#111] transition shadow-sm">
                  {c}
                </button>
              ))}
            </div>
          )}

          <div ref={endRef} />
        </div>
      </main>

      <div className="fixed bottom-0 inset-x-0 bg-gradient-to-t from-[#FAF9F7] via-[#FAF9F7] to-transparent pt-8 pb-6">
        <div className="w-full max-w-[760px] mx-auto px-6 md:px-8">
          {readyToFinish ? (
            <div className="flex flex-col items-center gap-4">
              <button onClick={finish}
                className="group w-full md:w-auto px-8 py-4 rounded-full bg-[#111] text-white text-[15px] font-medium flex items-center justify-center gap-3 shadow-[0_8px_24px_rgba(0,0,0,0.18)] hover:bg-black transition-all hover:-translate-y-0.5">
                <I.Sparkles size={16} /> Gerar meu plano <I.ChevronRight size={16} />
              </button>
              <p className="text-[11px] text-[#9C8F85]">
                Seus dados ficam só com você. Cálculos feitos por código, não por IA.
              </p>
            </div>
          ) : (
            <div className="flex items-end gap-3 bg-white rounded-[28px] border border-[#E8DDD0] shadow-[0_8px_30px_rgba(0,0,0,0.06)] px-2 py-2 focus-within:border-[#111] transition">
              <textarea
                ref={inputRef}
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } }}
                placeholder={script[step]?.placeholder}
                rows={1}
                aria-label="Sua resposta"
                className="flex-1 resize-none bg-transparent outline-none text-[15px] leading-[1.5] px-4 py-3 placeholder:text-[#B8A99A] max-h-[120px]"
              />
              <button onClick={() => submit()} disabled={!input.trim()}
                aria-label="Enviar"
                className="w-10 h-10 rounded-full bg-[#111] text-white flex items-center justify-center disabled:opacity-30 hover:bg-black transition shrink-0 mb-1">
                <I.Send size={16} />
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Tela de geração ───────────────────────────────────────── */
function Generating() {
  const [step, setStep] = useState(0);
  const steps = ["Mapeando fluxo", "Calculando margem", "Desenhando cenários"];
  useEffect(() => {
    const i = setInterval(() => setStep((s) => (s < 2 ? s + 1 : s)), 800);
    return () => clearInterval(i);
  }, []);
  return (
    <div className="min-h-screen bg-[#FAF9F7] flex flex-col items-center justify-center px-6">
      <Avatar size={48} />
      <h2 className="text-[20px] font-light tracking-tight text-[#111] mt-8 mb-2">Organizando suas informações...</h2>
      <p className="text-[13px] text-[#8A7F76] mb-10">Cálculos feitos por código, não por IA inventando.</p>
      <div className="w-full max-w-[320px] space-y-4">
        {steps.map((s, i) => (
          <div key={s} className={`flex items-center gap-3 p-4 rounded-2xl border transition-all duration-500 ${i <= step ? "bg-white border-[#111] shadow-sm" : "bg-white/50 border-[#E8DDD0] opacity-50"}`}>
            <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] transition ${i < step ? "bg-[#7A9E7E] text-white" : i === step ? "bg-[#111] text-white" : "bg-[#F2EDE8] text-[#9C8F85]"}`}>
              {i < step ? <I.Check size={12} /> : i + 1}
            </div>
            <span className={`text-[13px] ${i <= step ? "text-[#111] font-medium" : "text-[#8A7F76]"}`}>{s}</span>
            {i === step && <TypingDots />}
          </div>
        ))}
      </div>
      <div className="mt-10 h-1 w-[320px] bg-[#E8DDD0] rounded-full overflow-hidden">
        <div className="h-full bg-[#111] transition-all duration-700" style={{ width: `${((step + 1) / 3) * 100}%` }} />
      </div>
    </div>
  );
}

function NewEntryModal({ onClose, onSave }) {
  const [tipo, setTipo] = useState("despesa");
  const [descricao, setDescricao] = useState("");
  const [valor, setValor] = useState("");
  const [fixo, setFixo] = useState(false);

  const save = () => {
    const cents = parseMoneyToCents(valor);
    if (!descricao.trim() || !cents) return;
    onSave({
      id: String(Date.now()),
      tipo,
      descricao: descricao.trim(),
      valueCents: cents,
      date: new Date().toISOString(),
      isFixed: fixo,
    });
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/40 flex items-end md:items-center justify-center p-0 md:p-6" onClick={onClose}>
      <div className="bg-white w-full max-w-[480px] rounded-t-[28px] md:rounded-[28px] p-6 animate-fade-in" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5">
          <h3 className="text-[16px] font-medium">Novo lançamento</h3>
          <button onClick={onClose} aria-label="Fechar" className="w-8 h-8 rounded-full bg-[#FAF9F7] border border-[#E8DDD0] flex items-center justify-center">
            <I.X size={14} />
          </button>
        </div>

        <div className="flex gap-2 mb-4">
          {["despesa", "receita"].map((t) => (
            <button key={t} onClick={() => setTipo(t)}
              className={`flex-1 py-2.5 rounded-full text-[13px] font-medium capitalize transition border ${tipo === t ? "bg-[#111] text-white border-[#111]" : "bg-white border-[#E8DDD0] text-[#6B5F57]"}`}>
              {t}
            </button>
          ))}
        </div>

/* ── Modal de meta ─────────────────────────────────────────── */
function GoalModal({ onClose, onSave, initial }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [value, setValue] = useState(initial ? String(initial.valueCents / 100) : "");
  const [months, setMonths] = useState(initial?.months || 12);
  const [priority, setPriority] = useState(initial?.priority || "média");

  const save = () => {
    const cents = parseMoneyToCents(value);
    if (!title.trim() || !cents) return;
    onSave({
      id: initial?.id || String(Date.now()),
      title: title.trim(),
      valueCents: cents,
      months: Number(months) || 12,
      priority,
      progress: initial?.progress || 0,
    });
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/40 flex items-end md:items-center justify-center p-0 md:p-6" onClick={onClose}>
      <div className="bg-white w-full max-w-[480px] rounded-t-[28px] md:rounded-[28px] p-6 animate-fade-in" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5">
          <h3 className="text-[16px] font-medium">{initial ? "Editar meta" : "Nova meta"}</h3>
          <button onClick={onClose} aria-label="Fechar" className="w-8 h-8 rounded-full bg-[#FAF9F7] border border-[#E8DDD0] flex items-center justify-center">
            <I.X size={14} />
          </button>
        </div>

        <label className="block text-[12px] text-[#6B5F57] mb-1.5">O que você quer alcançar?</label>
        <input value={title} onChange={(e) => setTitle(e.target.value)}
          placeholder="Ex: Viagem para Europa"
          className="w-full bg-[#FAF9F7] border border-[#E8DDD0] rounded-2xl px-4 py-3 text-[14px] outline-none focus:border-[#111] mb-4" />

        <div className="grid grid-cols-2 gap-3 mb-4">
          <div>
            <label className="block text-[12px] text-[#6B5F57] mb-1.5">Valor</label>
            <input value={value} onChange={(e) => setValue(e.target.value)}
              placeholder="12.000" inputMode="decimal"
              className="w-full bg-[#FAF9F7] border border-[#E8DDD0] rounded-2xl px-4 py-3 text-[14px] outline-none focus:border-[#111]" />
          </div>
          <div>
            <label className="block text-[12px] text-[#6B5F57] mb-1.5">Prazo (meses)</label>
            <input value={months} onChange={(e) => setMonths(e.target.value)} type="number" min="1"
              className="w-full bg-[#FAF9F7] border border-[#E8DDD0] rounded-2xl px-4 py-3 text-[14px] outline-none focus:border-[#111]" />
          </div>
        </div>

        <label className="block text-[12px] text-[#6B5F57] mb-1.5">Prioridade</label>
        <div className="flex gap-2 mb-5">
          {["alta", "média", "baixa"].map((p) => (
            <button key={p} onClick={() => setPriority(p)}
              className={`flex-1 py-2 rounded-full text-[13px] capitalize transition border ${priority === p ? "bg-[#111] text-white border-[#111]" : "bg-white border-[#E8DDD0] text-[#6B5F57]"}`}>
              {p}
            </button>
          ))}
        </div>

        <button onClick={save} disabled={!title.trim() || !parseMoneyToCents(value)}
          className="w-full py-3.5 rounded-full bg-[#111] text-white text-[14px] font-medium disabled:opacity-30 hover:bg-black transition">
          {initial ? "Salvar alterações" : "Criar meta"}
        </button>
      </div>
    </div>
  );
}

/* ── Chat do consultor ─────────────────────────────────────── */
function ConsultantChat({ state, setState, apiKey, onNeedApiKey }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [error, setError] = useState(null);
  const endRef = useRef(null);

  useEffect(() => {
    setMessages([{
      role: "ai",
      text: apiKey
        ? `Oi${state.nome ? `, ${state.nome}` : ""}. Estou conectado com IA de verdade agora. Pode me dizer coisas como "minha renda é 9.000" ou "gastei 250 no mercado" que eu organizo tudo automaticamente.\n\nEu nunca invento dados — só uso o que você confirma.`
        : `Oi. Para eu funcionar com IA de verdade, preciso que você configure sua chave da OpenAI na engrenagem acima. Depois disso, eu organizo suas finanças automaticamente.`,
    }]);
  }, [apiKey]);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, typing]);

  const send = async (text) => {
    const t = (text ?? input).trim();
    if (!t) return;

    if (!apiKey) {
      onNeedApiKey();
      return;
    }

    setMessages((m) => [...m, { role: "user", text: t }]);
    setInput("");
    setTyping(true);
    setError(null);

    try {
      const reply = await runAIChat(
        apiKey,
        t,
        messages,
        state,
        (patch) => {
          setState((s) => ({ ...s, ...patch }));
        }
      );
      setMessages((m) => [...m, { role: "ai", text: reply }]);
    } catch (e) {
      setError(e.message);
      setMessages((m) => [...m, {
        role: "ai",
        text: `Desculpa, tive um problema ao conectar: ${e.message}\n\nVerifique se sua chave da OpenAI está correta e se você tem crédito na conta.`,
      }]);
    } finally {
      setTyping(false);
    }
  };

  const suggestions = [
    "Minha renda é 9.000",
    "Gastei 250 no mercado",
    "Tenho 10 mil guardados",
    "Quanto posso gastar?",
  ];

  return (
    <div className="max-w-[760px] mx-auto">
      <div className="bg-white rounded-[28px] border border-[#E8DDD0]/80 shadow-[0_1px_0_0_rgba(0,0,0,0.04),0_12px_32px_rgba(0,0,0,0.06)] flex flex-col h-[68vh] overflow-hidden">
        <div className="px-6 py-4 border-b border-[#F2EDE8] flex items-center gap-3">
          <Avatar />
          <div className="flex-1">
            <p className="text-[13px] font-medium">Claro — seu consultor</p>
            <p className="text-[11px] text-[#8A7F76] flex items-center gap-1">
              <span className={`w-1.5 h-1.5 rounded-full ${apiKey ? "bg-[#7A9E7E] animate-pulse" : "bg-[#C86B5A]"}`} />
              {apiKey ? "IA conectada (gpt-4o-mini)" : "IA não configurada"}
            </p>
          </div>
          <button onClick={onNeedApiKey} aria-label="Configurar chave"
            className="text-[11px] px-3 py-1.5 rounded-full border border-[#E8DDD0] hover:border-[#111] transition">
            {apiKey ? "trocar chave" : "configurar"}
          </button>
        </div>

        <div className="flex-1 overflow-y-auto p-6 space-y-4">
          {messages.map((m, i) => (
            <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"} animate-fade-in`}>
              <div className={`rounded-[18px] px-4 py-3 text-[13px] leading-[1.5] max-w-[85%] whitespace-pre-wrap
                ${m.role === "user" ? "bg-[#111] text-white rounded-tr-[6px]" : "bg-[#F2EDE8] text-[#2B211C] rounded-tl-[6px]"}`}>
                {m.text}
              </div>
            </div>
          ))}
          {typing && (
            <div className="flex justify-start">
              <div className="bg-[#F2EDE8] rounded-[18px] rounded-tl-[6px] px-4 py-3"><TypingDots /></div>
            </div>
          )}
          <div ref={endRef} />
        </div>

        {messages.length <= 1 && apiKey && (
          <div className="px-4 pb-2 flex flex-wrap gap-2">
            {suggestions.map((s) => (
              <button key={s} onClick={() => send(s)}
                className="text-[12px] px-3 py-1.5 rounded-full bg-[#FAF9F7] border border-[#E8DDD0] text-[#2B211C] hover:border-[#111] transition">
                {s}
              </button>
            ))}
          </div>
        )}

        <div className="p-3 border-t border-[#F2EDE8] bg-[#FAF9F7]/60">
          <div className="flex items-end gap-2 bg-white border border-[#E8DDD0] rounded-[22px] px-2 py-2 focus-within:border-[#111] transition">
            <textarea value={input} onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
              placeholder={apiKey ? "Ex: minha renda é 9k, ou gastei 250 no mercado..." : "Configure sua chave da OpenAI para começar"}
              rows={1} aria-label="Mensagem" disabled={!apiKey}
              className="flex-1 resize-none bg-transparent outline-none text-[14px] px-3 py-2 placeholder:text-[#B8A99A] disabled:opacity-50" />
            <button onClick={() => send()} disabled={!input.trim() || !apiKey} aria-label="Enviar"
              className="w-8 h-8 rounded-full bg-[#111] text-white flex items-center justify-center shrink-0 disabled:opacity-30">
              <I.Send size={14} />
            </button>
          </div>
          <p className="text-[10px] text-[#9C8F85] mt-2 px-2">
            IA organiza seus dados via function calling. Cálculos por código auditável. Chave fica só no seu navegador.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ── Componentes auxiliares do dashboard ───────────────────── */
function ScenarioCard({ scenario, plan, state, margin }) {
  const descriptions = {
    conservador: { title: "Conservador", action: "Foco total em segurança." },
    equilibrado: { title: "Equilibrado", action: "Equilíbrio entre hoje e amanhã." },
    acelerado: { title: "Acelerado", action: "Mais esforço agora, mais liberdade depois." },
  };
  const d = descriptions[scenario];
  return (
    <div className="bg-[#FAF9F7] rounded-2xl p-5 border border-[#E8DDD0]/60">
      <p className="text-[14px] font-medium text-[#111]">{d.title} • {d.action}</p>
      <ul className="text-[13px] text-[#6B5F57] mt-3 space-y-1.5 leading-[1.5]">
        <li>Guardar <b>{brl(plan.toSavingsCents)}</b> por mês na reserva.</li>
        {plan.toDebtCents > 0 && (
          <li>Destinar <b>{brl(plan.toDebtCents)}</b> para dívidas
            {plan.debtPayoffMonths && <> — quitação em <b>{plan.debtPayoffMonths} meses</b></>}.</li>
        )}
        {plan.toGoalsCents > 0 && <li>Separar <b>{brl(plan.toGoalsCents)}</b> para metas.</li>}
        {plan.emergencyReachMonths && (
          <li>Reserva chega a 6 meses em <b>{plan.emergencyReachMonths} meses</b>.</li>
        )}
      </ul>
      <p className="text-[11px] text-[#9C8F85] mt-3">
        Base: renda {brl(state.rendaMediaCents)} • fixos {brl(Finance.monthlyFixed(state))} • parcelas {brl(Finance.monthlyInstallments(state))} • margem {brl(margin)}
      </p>
    </div>
  );
}

function ActionList({ state, margin }) {
  const [done, setDone] = useState([]);
  const items = useMemo(() => [
    { id: "1", text: `Separar ${brl(Math.max(0, Math.round(margin * 0.5)))} para reserva assim que a renda cair` },
    { id: "2", text: "Negociar ou antecipar parcela do cartão para reduzir juros" },
    { id: "3", text: "Definir data fixa para revisão financeira toda segunda" },
    { id: "4", text: "Classificar 3 gastos pendentes desta semana" },
  ], [margin]);

  const toggle = (id) => setDone((d) => d.includes(id) ? d.filter((x) => x !== id) : [...d, id]);
  return (
    <div className="mt-5 space-y-3">
      {items.map((it) => {
        const isDone = done.includes(it.id);
        return (
          <button key={it.id} onClick={() => toggle(it.id)} className="w-full flex items-start gap-3 text-left group">
            <span className={`w-5 h-5 rounded-full border flex items-center justify-center shrink-0 mt-0.5 transition
              ${isDone ? "bg-[#111] border-[#111] text-white" : "border-[#E8DDD0] group-hover:border-[#111]"}`}>
              {isDone && <I.Check size={12} />}
            </span>
            <span className={`text-[13.5px] leading-[1.5] ${isDone ? "text-[#9C8F85] line-through" : "text-[#2B211C]"}`}>
              {it.text}
            </span>
          </button>
        );
      })}
    </div>
  );
}

/* ── App raiz ──────────────────────────────────────────────── */
const API_KEY_STORAGE = "claro:openai-key";

function App() {
  const [screen, setScreen] = useState("loading");
  const [user, setUser] = useState(null);
  const [state, setState] = useState(EMPTY_STATE);
  const [apiKey, setApiKey] = useState("");
  const [showApiKeyModal, setShowApiKeyModal] = useState(false);

  // ─── Boot: checa login e carrega dados ──────────────────
  useEffect(() => {
    (async () => {
      try { setApiKey(localStorage.getItem(API_KEY_STORAGE) || ""); } catch {}

      const currentUser = await getCurrentUser();
      if (currentUser) {
        setUser(currentUser);
        const saved = loadState();
        if (saved && saved.completed) {
          setState(saved);
          setScreen("dashboard");
        } else {
          setScreen("onboarding");
        }
      } else {
        setScreen("login");
      }
    })();

    // Escuta mudanças de sessão (login/logout)
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        setUser(session.user);
      } else {
        setUser(null);
        setScreen("login");
      }
    });
    return () => subscription.unsubscribe();
  }, []);

  // ─── Persistência ───────────────────────────────────────
  useEffect(() => {
    if (screen === "dashboard") saveState(state);
  }, [state, screen]);

  const saveApiKey = (k) => {
    setApiKey(k);
    try { localStorage.setItem(API_KEY_STORAGE, k); } catch {}
  };

  const handleComplete = (finalState) => {
    setState(finalState);
    setScreen("generating");
    setTimeout(() => setScreen("dashboard"), 2600);
  };

  const handleSkip = () => {
    setState(DEMO_STATE);
    setScreen("generating");
    setTimeout(() => setScreen("dashboard"), 2600);
  };

  const handleReset = async () => {
    if (!confirm("Apagar todos os dados armazenados?")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    setState(EMPTY_STATE);
    setScreen("onboarding");
  };

  // ─── Render ─────────────────────────────────────────────
  if (screen === "loading") {
    return <div className="min-h-screen bg-[#FAF9F7] flex items-center justify-center text-[#9C8F85] text-[13px]">Carregando…</div>;
  }
  if (screen === "login") return <LoginScreen />;
  if (screen === "onboarding") return <Onboarding onComplete={handleComplete} onSkip={handleSkip} />;
  if (screen === "generating") return <Generating />;

  return (
    <>
      <Dashboard
        state={state}
        setState={setState}
        onReset={handleReset}
        apiKey={apiKey}
        onNeedApiKey={() => setShowApiKeyModal(true)}
        user={user}
      />
      {showApiKeyModal && (
        <ApiKeyModal
          current={apiKey}
          onSave={saveApiKey}
          onClose={() => setShowApiKeyModal(false)}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
